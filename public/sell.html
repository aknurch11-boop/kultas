<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KülTas — разместить партию</title>
  <script>try{var t=localStorage.getItem("kultas-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="shell"></header>

  <main class="wrap">
    <section>
      <h1 data-i18n="sell_title"></h1>
      <p class="lead" data-i18n="sell_lead"></p>

      <div class="sell-layout">
        <form class="sell-steps" id="sellForm" novalidate>
          <div class="card step">
            <h3><span class="step-num">1</span><span data-i18n="sell_photo"></span></h3>
            <label class="dropzone" for="photoInput">
              <span data-i18n="sell_photo_btn"></span>
              <small data-i18n="sell_photo_hint"></small>
            </label>
            <input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden>
            <div class="thumbs" id="thumbs"></div>
          </div>

          <div class="card step">
            <h3><span class="step-num">2</span><span data-i18n="sell_type"></span></h3>
            <div class="type-cards" id="typeCards"></div>
            <div id="typeCredits"></div>
            <div id="flyOptions" hidden>
              <div class="filter-group"><span data-i18n="sub_title"></span><div class="chips" id="subChips"></div></div>
              <div class="filter-group"><span data-i18n="gost_title"></span><div class="chips" id="gostChips"></div></div>
            </div>
          </div>

          <div class="card step">
            <h3><span class="step-num">3</span><span data-i18n="sell_volume"></span></h3>
            <div class="row" style="flex-wrap:nowrap">
              <label class="field" style="flex:1"><span data-i18n="db_tons"></span><input id="sTons" type="number" min="1" step="25"></label>
              <label class="field" style="flex:1"><span data-i18n="db_price"></span><input id="sPrice" type="number" min="0" step="500"></label>
            </div>
            <div class="filter-group"><span data-i18n="ship_title"></span><div class="chips" id="shipChips"></div></div>
          </div>

          <div class="card step">
            <h3><span class="step-num">4</span><span data-i18n="sell_where"></span></h3>
            <div class="row" style="flex-wrap:nowrap">
              <label class="field" style="flex:1"><span data-i18n="db_plant"></span><input id="sPlant" maxlength="80"></label>
              <label class="field" style="flex:1"><span data-i18n="db_city"></span><input id="sCity" maxlength="40"></label>
            </div>
            <div class="row">
              <button class="btn ghost sm" type="button" id="gpsBtn" data-i18n="sell_gps"></button>
              <span class="hint" id="locHint" data-i18n="db_loc"></span>
            </div>
            <div id="sellMap" class="sell-map"></div>
          </div>

          <details class="card step">
            <summary><h3 style="display:inline"><span class="step-num">5</span><span data-i18n="sell_lab"></span></h3></summary>
            <div class="lab-grid">
              <label class="field"><span>SiO₂+Al₂O₃+Fe₂O₃, %</span><input id="lMain" type="number" step="0.1"></label>
              <label class="field"><span>CaO, %</span><input id="lCao" type="number" step="0.1"></label>
              <label class="field"><span data-i18n="lab_loi"></span><input id="lLoi" type="number" step="0.1"></label>
              <label class="field"><span>SO₃, %</span><input id="lSo3" type="number" step="0.1"></label>
              <label class="field"><span data-i18n="lab_moisture"></span><input id="lMoisture" type="number" step="0.1"></label>
              <label class="field"><span>Бк/кг · Bq/kg</span><input id="lActivity" type="number" step="1"></label>
            </div>
            <p class="hint ok" id="caoHint" hidden></p>
          </details>

          <p class="error" id="sError" hidden></p>
          <button class="btn primary block" type="submit" id="sSubmit" data-i18n="sell_publish"></button>
        </form>

        <aside class="sell-preview">
          <p class="eyebrow" data-i18n="sell_preview"></p>
          <div id="preview"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="foot"></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="/js/sell.js"></script>
</body>
</html>
